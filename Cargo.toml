[package]
name = "vibes"
description = "Mechanical keyboard sounds on every key press, for macOS (Mechvibes sound packs)"
readme = "README.md"
repository = "https://github.com/blakesimpson-dev/vibes"
license = "MIT OR Apache-2.0"
version = "2.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
core-foundation = "0.10"
core-graphics = "0.25"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "vorbis", "wav"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
